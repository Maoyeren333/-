name: Train weights (self-hosted GPU)

# 训练必须有 GPU，而 GitHub 托管的 runner 没有 GPU，所以这个工作流只能在
# 你自己的 GPU 机器（或云主机）上注册 self-hosted runner 后使用。
# 注册方式：仓库 Settings → Actions → Runners → New self-hosted runner，
# 打上 gpu 标签，然后这里 runs-on: [self-hosted, gpu] 才会有人接单。
#
# 只用 workflow_dispatch 手动触发，不会随 push 自动跑。
# 数据与脚本路径按你的机器实际位置改（下面标了 TODO）。

on:
  workflow_dispatch:
    inputs:
      algorithm:
        description: 要训练哪个算法
        type: choice
        options:
          - change_detection
          - semantic_segmentation
        default: change_detection
      epochs:
        description: 训练轮数
        type: string
        default: "225"

jobs:
  train:
    name: 训练并产出权重
    runs-on: [self-hosted, gpu]
    timeout-minutes: 2880
    env:
      # TODO: 改成你 GPU 机器上的真实路径
      DATA_ROOT: /data/CD-Data
      WORKSPACE: ${{ github.workspace }}/training
    steps:
      - uses: actions/checkout@v4

      - name: 准备训练代码与数据
        run: |
          mkdir -p "$WORKSPACE"
          if [ "${{ inputs.algorithm }}" = "change_detection" ]; then
            unzip -q -o data-official/STFF-GA.zip -d "$WORKSPACE" || \
              echo "TODO: 把官方 STFF-GA 源码解压到 $WORKSPACE（仓库不存放官方源码压缩包）"
          else
            unzip -q -o data-official/ST-UNet.zip -d "$WORKSPACE" || \
              echo "TODO: 把官方 ST-UNet 源码解压到 $WORKSPACE"
          fi

      - name: 训练（变化检测 STFF-GA）
        if: inputs.algorithm == 'change_detection'
        working-directory: ${{ env.WORKSPACE }}
        run: |
          # 官方 train.py 里数据根目录是硬编码的，跑之前先改成你的 DATA_ROOT
          python train.py --data_name WHU --epoch "${{ inputs.epochs }}" --batchsize 64 --save_path ./checkpoints/

      - name: 训练（语义分割 ST-UNet）
        if: inputs.algorithm == 'semantic_segmentation'
        working-directory: ${{ env.WORKSPACE }}
        run: |
          # 官方 train.py 的 snapshot 路径同样需要改成可写目录
          python train.py --root_path "$DATA_ROOT/Vai_256_npz" --dataset Vai --num_classes 6 \
            --img_size 256 --max_epochs "${{ inputs.epochs }}" --batch_size 8 --vit_name R50-ViT-B_16 --n_skip 3

      - name: 归一化权重文件名并计算 sha256
        run: |
          mkdir -p python-inference/weights
          if [ "${{ inputs.algorithm }}" = "change_detection" ]; then
            OUT=python-inference/weights/stff_ga.pth
            cp "$(ls -t $WORKSPACE/checkpoints/*.pth | head -1)" "$OUT"
          else
            OUT=python-inference/weights/st_unet.pth
            cp "$(ls -t $WORKSPACE/**/epoch_*.pth | head -1)" "$OUT"
          fi
          echo "权重：$(basename "$OUT") $(du -h "$OUT" | cut -f1) sha256=$(shasum -a 256 "$OUT" | cut -d' ' -f1)"

      - uses: actions/upload-artifact@v4
        with:
          name: weights-${{ inputs.algorithm }}
          path: python-inference/weights/*.pth
          retention-days: 30
          # 权重通常远超 GitHub 单文件 100 MB 限制，若超过请改用 Release 附件上传：
          #   gh release upload v1.0-weights python-inference/weights/*.pth
