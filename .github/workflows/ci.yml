name: CI
on:
  push:
    branches: [main, master, 'feat/**']
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B test
        working-directory: springboot-backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vue-frontend/package-lock.json
      - run: npm ci
        working-directory: vue-frontend
      - run: npm run build
        working-directory: vue-frontend

  inference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      # Real checkpoint is intentionally not stored in Git. CI covers service failures and file contracts.
      - run: pip install 'fastapi>=0.115.6,<1' 'pydantic>=2.10,<3' 'httpx>=0.27,<1' numpy pillow rasterio
      - run: python -m compileall -q camouflaged_object_detection common main.py scripts tests
        working-directory: python-inference
      - run: python -m unittest discover -s tests -v
        working-directory: python-inference
