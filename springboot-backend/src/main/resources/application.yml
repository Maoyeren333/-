server:
  port: 8080

spring:
  # 数据库账号密码不要写进仓库：优先用环境变量，其次由 application-local.yml 覆盖。
  # application-local.yml 已加入 .gitignore，本地放真实的 DB 密码。
  config:
    import: optional:classpath:application-local.yml
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:uav_remote_sensing}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 2GB
      max-request-size: 2GB

inference:
  url: ${INFERENCE_URL:http://localhost:8000}

storage:
  # 原始影像落盘目录（相对路径按进程工作目录解析为绝对路径）
  images-dir: ./data/images
